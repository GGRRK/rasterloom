# SPDX-License-Identifier: GPL-3.0-or-later
# Rasterloom CI (BUILD-SPEC <stack>, <verification>, <eyes> and the 2026-09-26 addendum).
# Host runner pinned to ubuntu-24.04 (never ubuntu-latest); the build runs inside ubuntu:22.04 for
# the glibc 2.35 floor, with GCC 11 and Qt 6.9.3 pinned exactly (dependabot ignores Qt).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.9.3"
  QT_ARCH: linux_gcc_64
  QT_DIR: /opt/qt/6.9.3/gcc_64
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "1"
  DEBIAN_FRONTEND: noninteractive
  # Tests never open a window; gui-smoke below is the only step that talks to a display (Xvfb).
  QT_QPA_PLATFORM: offscreen

jobs:
  build-test:
    name: build, unit, goldens, mutation gate, gui-smoke
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    steps:
      - name: Install toolchain and libraries (apt)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential gcc-11 g++-11 cmake ninja-build ccache pkg-config \
            libpng-dev zlib1g-dev liblz4-dev nlohmann-json3-dev libgtest-dev \
            libjpeg-turbo8-dev libtiff-dev libzip-dev liblcms2-dev \
            python3 python3-pip python3-venv \
            xvfb xauth libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1 \
            libfreetype6 libdbus-1-3 libwayland-client0 libwayland-cursor0 libwayland-egl1
          gcc-11 --version | head -1

      - uses: actions/checkout@v4

      - name: Python tools (pinned)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements-ci.txt

      - name: Restore Qt ${{ env.QT_VERSION }}
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-icu-qtbase-qtsvg-qtwayland-v1

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall; qtbase + qtsvg + qtwayland)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            --outputdir /opt/qt --archives icu qtbase qtsvg qtwayland
          test -f "$QT_DIR/lib/cmake/Qt6/Qt6Config.cmake"
          find "$QT_DIR/plugins/platforms" -name '*.so' | grep -E 'libqwayland(-generic)?\.so'

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gcc11-qt${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: ccache-gcc11-qt${{ env.QT_VERSION }}-

      - name: Configure (GCC 11, Release, warnings are errors)
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$QT_DIR" -DRL_WERROR=ON

      - name: Build
        run: |
          cmake --build build
          ccache --show-stats | head -20

      - name: Unit tests, goldens (all domains), determinism
        # One ctest run writes the junit that gen_parity validates evidence against, so every
        # parity claim is backed by a test that passed in this same job.
        run: |
          ctest --test-dir build -LE slow --output-on-failure --output-junit ctest-junit.xml \
            -j "$(nproc)"

      - name: Mutation gate (every registry id; PENDING ids fail - RL_MUTATION_ALLOW_PENDING is unset)
        if: always()
        run: ctest --test-dir build -L slow --output-on-failure --output-junit ctest-junit-slow.xml

      - name: GUI tests (Xvfb; GL canvas on Mesa llvmpipe)
        if: always()
        # Every GUI ctest: gui_version, gui_offscreen_smoke, gui_selftest_embedded and the tests/gui
        # suite (gui-smoke, gui-session, gui-gl-canvas, gui-stroke-live, gui-file-io, gui-editing,
        # gui-transform, gui-selftest, ...), hence '^gui[-_]'. The offscreen tests unset DISPLAY
        # themselves; gui-gl-canvas keeps it and draws through GLX on Xvfb with llvmpipe. It skips
        # itself without a GL 3.3 core context, which here would mean a broken runner: fail on it.
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            ctest --test-dir build -R '^gui[-_]' --output-on-failure --output-junit ctest-junit-gui.xml \
            | tee gui-ctest.log
          if ! grep -qE 'gui-gl-canvas \.+ +Passed' gui-ctest.log; then
            echo "::error::gui-gl-canvas did not pass on llvmpipe (skipped or failed)"
            exit 1
          fi

      - name: Contact sheets from the C++ renders
        if: always()
        run: |
          python3 tests/tools/run_goldens.py --cli build/src/rasterloom-cli --single --keep-all \
            --out build/sheets-src || true
          python3 tests/tools/contact_sheet.py --out build/sheets-src --source cpp
          mkdir -p visual-artifacts
          cp build/sheets-src/sheets/*.png visual-artifacts/
          cp tests/output/gui-contact-sheet.png visual-artifacts/ 2>/dev/null || true

      - name: Generate docs/PARITY.md (fails on any unproven claim)
        if: always()
        run: |
          python3 tools/gen_parity.py --report tests/output/report.json \
            --ctest-junit build/ctest-junit.xml --ctest-junit build/ctest-junit-gui.xml --readme README.md
          cp docs/PARITY.md README.md visual-artifacts/ 2>/dev/null || true

      - name: Third-party notices
        if: always()
        run: |
          PATH="$QT_DIR/bin:$PATH" python3 tools/gen_third_party_notices.py \
            --set "Qt (Core, Gui, Widgets, Concurrent, Svg, OpenGLWidgets, WaylandClient)=$QT_VERSION" \
            --out visual-artifacts/THIRD-PARTY-NOTICES.md

      - name: Collect failing golden diffs
        if: always()
        run: |
          mkdir -p visual-artifacts/golden-failures
          cd tests/output
          find . -path ./.refcache -prune -o \( -name 'ref.png' -o -name 'cpp.png' -o \
            -name 'diff*.png' -o -name '*.log' -o -name 'equal_to-target.png' \) \
            -exec cp --parents {} ../../visual-artifacts/golden-failures/ \; || true
          cp report.json ../../visual-artifacts/golden-report.json 2>/dev/null || true

      - name: Upload visual-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-artifacts
          path: |
            visual-artifacts/
            build/ctest-junit*.xml
            build/tests/mutation-gate/mutation_gate.json
          if-no-files-found: warn
          retention-days: 14

  package:
    # BUILD-SPEC <stack>/<verification> + addendum: the distributable AppImage. ubuntu:22.04 container
    # (glibc 2.35 floor), GCC 11, Qt 6.9.3 via aqtinstall; packaging/build-appimage.sh does the rest
    # (pinned linuxdeploy + plugin-qt, uruntime v0.6.1 with URUNTIME_EXTRACT=2, appimagetool 1.9.1)
    # and runs packaging/check-bundle.sh. Then the artifact itself is tested under Xvfb.
    name: package (AppImage) + artifact self-test
    needs: build-test
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    timeout-minutes: 45
    env:
      RL_GLIBC_FLOOR: "2.35"
      GOLDEN: tests/scripts/compositing/clip_adjust.json
    steps:
      - name: Install toolchain, libraries and packaging tools (apt)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git file build-essential gcc-11 g++-11 cmake ninja-build ccache pkg-config \
            libpng-dev zlib1g-dev liblz4-dev nlohmann-json3-dev libjpeg-turbo8-dev libtiff-dev \
            python3 python3-pip squashfs-tools desktop-file-utils xvfb xauth util-linux procps \
            libgl1-mesa-dev libegl1-mesa-dev libgl1-mesa-dri libfontconfig1 libfreetype6 libdbus-1-3 \
            libglib2.0-0 libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libsm6 libice6 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-shm0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-util1 libxcb-glx0 libxcb-xinput0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - uses: actions/checkout@v4

      - name: Python tools (pinned)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r tools/requirements-ci.txt

      - name: Restore Qt ${{ env.QT_VERSION }}
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: /opt/qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-icu-qtbase-qtsvg-qtwayland-v1

      - name: Install Qt ${{ env.QT_VERSION }} (aqtinstall; qtbase + qtsvg + qtwayland)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m aqt install-qt linux desktop "$QT_VERSION" "$QT_ARCH" \
            --outputdir /opt/qt --archives icu qtbase qtsvg qtwayland
          test -f "$QT_DIR/lib/cmake/Qt6/Qt6Config.cmake"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-gcc11-qt${{ env.QT_VERSION }}-pkg-${{ github.sha }}
          restore-keys: |
            ccache-gcc11-qt${{ env.QT_VERSION }}-pkg-
            ccache-gcc11-qt${{ env.QT_VERSION }}-

      - name: Restore pinned packaging tools
        uses: actions/cache@v4
        with:
          path: packaging/_tools
          key: pkgtools-${{ hashFiles('packaging/build-appimage.sh') }}

      - name: Build (GCC 11, Release, no tests)
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-11 -DCMAKE_CXX_COMPILER=g++-11 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$QT_DIR" -DRL_WERROR=ON -DRL_BUILD_TESTS=OFF
          cmake --build build

      - name: Build the AppImage (+ check-bundle)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          desktop-file-validate share/rasterloom.desktop
          QMAKE="$QT_DIR/bin/qmake" RL_SOURCE_URL="${{ github.server_url }}/${{ github.repository }}" \
            packaging/build-appimage.sh --no-build --build-dir build --out dist
          cp dist/AppDir/usr/share/doc/rasterloom/THIRD-PARTY-NOTICES.md \
             dist/AppDir/usr/share/doc/rasterloom/WRITTEN-OFFER.txt dist/

      - name: Expected render (build tree), proven equal to the NumPy reference
        run: |
          build/src/rasterloom-cli --render-script "$GOLDEN" --out dist/expected.png
          python3 tests/tools/run_goldens.py --cli build/src/rasterloom-cli --single \
            --filter "$(basename "$GOLDEN" .json)" --out build/golden-expected

      - name: Artifact self-test under Xvfb (xcb GUI start, render, --selftest)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" env RL_TEST_XCB=1 \
            packaging/test-artifact.sh dist/Rasterloom-x86_64.AppImage "$GOLDEN" dist/expected.png \
            dist/artifact-test-ubuntu-22.04
          # BUILD-SPEC <verification>, verbatim
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a -s "-screen 0 1920x1080x24" ./dist/Rasterloom-x86_64.AppImage --selftest \
            --junit-xml=dist/results.xml

      - name: Every golden through the shipped bundle, against the NumPy reference + contact sheets
        # Runs the extracted bundle (usr/bin + usr/lib from the AppImage), not the build tree.
        # Parallel extract-and-run launches of one AppImage race on the extraction directory
        # ("Text file busy"), so the bundle is extracted once here.
        run: |
          mkdir -p dist/extracted && cd dist/extracted && ../Rasterloom-x86_64.AppImage --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"
          printf '#!/bin/sh\nexec "%s/dist/extracted/squashfs-root/AppRun" --cli "$@"\n' "$GITHUB_WORKSPACE" > dist/cli-from-bundle
          chmod +x dist/cli-from-bundle
          python3 tests/tools/run_goldens.py --cli dist/cli-from-bundle --single --keep-all --out dist/goldens
          python3 tests/tools/contact_sheet.py --out dist/goldens --source cpp
          mkdir -p dist/contact-sheets && cp dist/goldens/sheets/*.png dist/contact-sheets/

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/Rasterloom-x86_64.AppImage
            dist/Rasterloom-x86_64.AppImage.sha256
            dist/expected.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload package reports and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-reports
          path: |
            dist/THIRD-PARTY-NOTICES.md
            dist/WRITTEN-OFFER.txt
            dist/bundle-manifest.yaml
            dist/*.log
            dist/results.xml
            dist/artifact-test-ubuntu-22.04/
            dist/contact-sheets/
            dist/goldens/report.json
          if-no-files-found: warn
          retention-days: 30

  distro-matrix:
    # The only step that proves the artifact runs on other systems: each container gets the host
    # libraries a desktop has (GL, fontconfig, X11/xcb, Wayland client, glib, dbus) and Xvfb, never
    # a compiler or Qt, then runs the shipped AppImage: --version --verbose, one byte-exact render,
    # --selftest, and an xcb GUI start. Also once without APPIMAGE_EXTRACT_AND_RUN, which proves
    # URUNTIME_EXTRACT=2 falls back to extraction when there is no FUSE (containers have none).
    name: artifact on ${{ matrix.name }}
    needs: package
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ubuntu-22.04, image: "ubuntu:22.04", family: apt}
          - {name: ubuntu-24.04, image: "ubuntu:24.04", family: apt}
          - {name: ubuntu-26.04, image: "ubuntu:26.04", family: apt}
          - {name: debian-12, image: "debian:12", family: apt}
          - {name: fedora-42, image: "fedora:42", family: dnf}
          - {name: archlinux, image: "archlinux:latest", family: pacman}
          - {name: opensuse-tumbleweed, image: "opensuse/tumbleweed", family: zypper}
    env:
      GOLDEN: tests/scripts/compositing/clip_adjust.json
    steps:
      - name: Install desktop runtime libraries + Xvfb (${{ matrix.family }})
        run: |
          case "${{ matrix.family }}" in
            apt)
              apt-get update
              # t64-renamed packages on 24.04+: try the new name, fall back to the old one
              pick() { for p in "$@"; do apt-cache show "$p" >/dev/null 2>&1 && { echo "$p"; return; }; done; }
              apt-get install -y --no-install-recommends ca-certificates tar gzip util-linux procps diffutils \
                xvfb xauth libgl1 libegl1 libopengl0 libfontconfig1 libx11-6 libx11-xcb1 \
                libxcb1 libsm6 libice6 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
                "$(pick libfreetype6t64 libfreetype6)" "$(pick libglib2.0-0t64 libglib2.0-0)" \
                "$(pick libdbus-1-3t64 libdbus-1-3)"
              # Mesa DRI only lets the GL canvas probe run under Xvfb; the raster fallback covers
              # its absence, so a renamed package must not fail the job.
              apt-get install -y --no-install-recommends libgl1-mesa-dri || true ;;
            dnf)
              dnf install -y --setopt=install_weak_deps=False tar gzip util-linux procps-ng diffutils findutils \
                xorg-x11-server-Xvfb xorg-x11-xauth mesa-libGL mesa-libEGL libglvnd-opengl mesa-dri-drivers \
                fontconfig freetype libX11 libX11-xcb libxcb libSM libICE libwayland-client libwayland-cursor \
                libwayland-egl glib2 dbus-libs ;;
            pacman)
              pacman -Syu --noconfirm --needed tar gzip util-linux procps-ng diffutils findutils \
                xorg-server-xvfb xorg-xauth libglvnd mesa fontconfig freetype2 libx11 libxcb libsm libice \
                wayland glib2 dbus ;;
            zypper)
              zypper --non-interactive install --no-recommends tar gzip util-linux procps diffutils findutils \
                xorg-x11-server-Xvfb xauth Mesa-libGL1 Mesa-libEGL1 'libOpenGL.so.0()(64bit)' Mesa-dri fontconfig \
                libfreetype6 libX11-6 libX11-xcb1 libxcb1 libSM6 libICE6 libwayland-client0 \
                libwayland-cursor0 libwayland-egl1 libglib-2_0-0 libgthread-2_0-0 libdbus-1-3 ;;
          esac
          . /etc/os-release && echo "$PRETTY_NAME; $(getconf GNU_LIBC_VERSION)"

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist

      - name: Verify checksum
        run: cd dist && sha256sum -c Rasterloom-x86_64.AppImage.sha256

      - name: Run the artifact under Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp >/tmp/xvfb.log 2>&1 &
          for _ in $(seq 1 50); do [ -e /tmp/.X11-unix/X99 ] && break; sleep 0.1; done
          export DISPLAY=:99
          chmod +x dist/Rasterloom-x86_64.AppImage
          # no APPIMAGE_EXTRACT_AND_RUN: the runtime must fall back to extraction by itself
          env -u APPIMAGE_EXTRACT_AND_RUN ./dist/Rasterloom-x86_64.AppImage --version
          RL_TEST_XCB=1 packaging/test-artifact.sh dist/Rasterloom-x86_64.AppImage "$GOLDEN" \
            dist/expected.png "dist/artifact-test-${{ matrix.name }}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-test-${{ matrix.name }}
          path: dist/artifact-test-${{ matrix.name }}/
          if-no-files-found: warn
          retention-days: 14
