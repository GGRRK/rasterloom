# SPDX-License-Identifier: GPL-3.0-or-later
# Rasterloom capability catalogue against Adobe Photoshop (desktop).
#
# This file is the single source of docs/PARITY.md and of the README headline. Generate with
#   python3 tools/gen_parity.py --report tests/output/report.json --ctest-junit build/ctest-junit.xml
# and never hand-edit PARITY.md or the README block between the parity markers.
#
# Source of the rows: Adobe's PUBLIC "Photoshop User Guide" on helpx.adobe.com (table of contents,
# Tools, Filter effects reference, Supported file formats, Blending mode descriptions pages).
# helpx.adobe.com answers automated requests with HTTP 403, so the pages were read through the
# Internet Archive copies (web.archive.org/web/2025/https://helpx.adobe.com/photoshop/using/...)
# on 2026-09-26. Photoshop itself was never run, read or probed.
#
# Rules (BUILD-SPEC <honest_scope>):
#  - The denominator freezes at v1. Rows may be ADDED, never deleted;  is the only
#    retirement path and needs `wontfix_reason`. Ids are stable: never renumber, append new ids.
#  - status: missing | stub | functional | parity | wontfix. A stub counts as missing.
#      functional = implemented in the core and proven by  that PASSED in the report
#                   gen_parity.py is given; behaviour may differ from Photoshop in documented ways.
#      parity     = as functional, AND the behaviour is the Photoshop semantics written down in
#                   docs/math (W3C Compositing-1 / Adobe's public specs), proven byte-exact by
#                   goldens against the independent NumPy reference (never against Adobe output).
#  - `evidence` (required for functional/parity) is a list of "golden:<glob over golden names>"
#    (tests/output/report.json; every match must PASS and at least one must match) or
#    "ctest:<test name or glob>" (ctest --output-junit XML; same rule).
#  - `planned_evidence` names the goldens that will prove a row once its lane lands. It is never
#    counted; gen_parity.py lists rows whose planned evidence already passes (promotion hints).
#  - tier 0 = "if these are missing it is not Photoshop" (about 100 rows), 1 = common
#    professional use, 2 = specialist or legacy.
#
# Surface: every functional/parity row is proven through librasterloomcore and the render-script
# API (rasterloom-cli, also the future scripting API) and, since the v0.1 GUI landed, is reachable
# from the Qt GUI; rows whose evidence names ctest:gui-* are proven through the GUI itself.
surface_note: "Statuses describe the core engine, proven through render scripts (rasterloom-cli), and the v0.1 Qt GUI. Every functional/parity row is reachable from the GUI's tools, menus or panels; the GUI as a whole is exercised by the gui-smoke test (30 scripted interactions plus every menu action), and rows citing ctest:gui-* are proven there. Tablet pressure is proven only through synthetic events."

# Weighted everyday-workflow coverage =
#   sum over areas of area_weight * (sum of tier weights of covered rows / sum of tier weights of
#   all rows in the area), where a row is covered when status is functional or parity.
# The ceiling is the same sum with every non-wontfix row covered. Area weights must sum to 1.0.
# They estimate the share of an everyday photo/compositing session spent in each area.
weights:
  tier: {0: 4, 1: 2, 2: 1}
  area:
    LAYER: 0.13
    SEL: 0.10
    ADJ: 0.10
    PAINT: 0.08
    FILE: 0.08
    TOOL: 0.07
    MASK: 0.07
    EDIT: 0.07
    BLEND: 0.05
    IMG: 0.05
    FLT: 0.04
    VIEW: 0.03
    HIST: 0.03
    TYPE: 0.03
    COLOR: 0.02
    STYLE: 0.02
    VECTOR: 0.01
    WS: 0.01
    AUTO: 0.005
    AI: 0.005
    VIDEO: 0.0

areas:
