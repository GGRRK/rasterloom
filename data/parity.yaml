  FILE: {title: "File menu and file formats", source: "Photoshop User Guide: Create, open, and import images; Save and export; Supported file formats in Photoshop"}
  EDIT: {title: "Edit menu", source: "Photoshop User Guide: Undo and history; Fill objects, selections, and layers; Transform, manipulate, and reshape"}
  IMG: {title: "Image menu (modes, size, canvas)", source: "Photoshop User Guide: Color modes; Resize and adjust resolution; Crop and straighten"}
  LAYER: {title: "Layers", source: "Photoshop User Guide: Create and manage layers; Layers overview; Organize layers with layer groups"}
  MASK: {title: "Masks, clipping and channels", source: "Photoshop User Guide: Create masks; Layer masks; Clipping masks; Channel basics"}
  BLEND: {title: "Blend modes and blending options", source: "Photoshop User Guide: Blending mode descriptions; Layer opacity and blending"}
  SEL: {title: "Selections", source: "Photoshop User Guide: Make selections; Refine and modify selections"}
  ADJ: {title: "Adjustments", source: "Photoshop User Guide: Color adjustment and fill layers; Color corrections"}
  FLT: {title: "Filters", source: "Photoshop User Guide: Effects and filters; Filter effects reference"}
  STYLE: {title: "Layer styles", source: "Photoshop User Guide: Apply layer effects; Layer style effects and options overview"}
  COLOR: {title: "Color management and color picking", source: "Photoshop User Guide: Color profiles; Choose colors; Color settings"}
  PAINT: {title: "Painting and brushes", source: "Photoshop User Guide: Apply painting techniques; Brushes and presets"}
  TYPE: {title: "Type", source: "Photoshop User Guide: Text and typography"}
  VECTOR: {title: "Paths and shapes", source: "Photoshop User Guide: Draw shapes and paths"}
  VIEW: {title: "View, navigation and measurement", source: "Photoshop User Guide: Use grids and measurement guides; Overview of navigation and measuring tools"}
  WS: {title: "Workspace and application", source: "Photoshop User Guide: Workspace overview; Settings and preferences; Troubleshoot"}
  HIST: {title: "History", source: "Photoshop User Guide: Use Undo and Redo commands; History panel settings"}
  AUTO: {title: "Automation", source: "Photoshop User Guide: Automate tasks"}
  AI: {title: "Generative and neural features", source: "Photoshop User Guide: Generative AI in Photoshop; Neural filters"}
  VIDEO: {title: "Video, animation, 3D and print", source: "Photoshop User Guide: Add video and animation; Print"}

